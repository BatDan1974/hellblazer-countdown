name: Refresh Instagram token

# Long-lived Instagram tokens last 60 days. This renews it monthly and stores the new
# one back into the IG_ACCESS_TOKEN secret. Needs a repo secret GH_PAT: a fine-grained
# personal access token for THIS repo with "Secrets: Read and write" permission.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh and store the new token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_TOKEN="$(python countdown.py refresh-token --raw)"
          echo "::add-mask::$NEW_TOKEN"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW_TOKEN"
          echo "Token refreshed."
