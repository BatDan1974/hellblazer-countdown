name: Build next Hellblazer post

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hellblazer-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install ffmpeg (for recap Shorts)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build the next Ready issue's card and caption
        env:
          SHEET_CSV: ${{ secrets.SHEET_CSV_URL }}
        run: python countdown.py prepare

      - name: Build any completed recap Short (every 5 issues)
        env:
          SHEET_CSV: ${{ secrets.SHEET_CSV_URL }}
        run: python shorts.py --auto

      - name: Commit the card + any new Short if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEXT_POST.md public/posts public/shorts
          git commit -m "Update next post / recap short" || echo "nothing changed"
          git push
