name: Build next Hellblazer post

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hellblazer-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the next Ready issue's card and caption
        env:
          SHEET_CSV: ${{ secrets.SHEET_CSV_URL }}
        run: python countdown.py prepare

      - name: Commit the card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEXT_POST.md public/posts
          git commit -m "Update next post" || echo "nothing changed"
          git push
