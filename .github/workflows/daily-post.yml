name: Daily Hellblazer post

on:
  schedule:
    - cron: "30 17 * * *"   # 17:30 UTC every day (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only - do not publish or post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hellblazer-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick the next Ready issue and render its image
        env:
          SHEET_CSV: ${{ secrets.SHEET_CSV_URL }}
        run: python countdown.py prepare

      - name: Publish the image file (Instagram fetches it from a public URL)
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/posts
          git commit -m "Add post image" || echo "nothing new to commit"
          git push

      - name: Post to Instagram
        if: ${{ !inputs.dry_run }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python countdown.py publish

      - name: Record what was posted
        if: ${{ !inputs.dry_run }}
        run: |
          git add state/posted.json
          git commit -m "Record post" || echo "nothing new to commit"
          git push

      - name: Keep the rendered image from a dry run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-post
          path: |
            public/posts
            state/next.json
